<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reportes INMONTE</title>
<meta name="description" content="Todos los reportes de INMONTE en un solo sitio: supply chain, fletes, gastos, publicidad y cotizador de compras.">
<meta name="theme-color" content="#173628">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23173628'/%3E%3Cpath d='M4 24 12.5 10l4.6 7.4L20.5 12 28 24Z' fill='%23E6B13A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --marco:#173628;      /* monte: frame and bar */
  --marco-2:#21483A;
  --maiz:#E6B13A;       /* accent: active report, focus */
  --niebla:#EEF1EC;     /* home sheet */
  --papel:#FFFFFF;
  --tinta:#1B2520;
  --musgo:#56665D;
  --linea:#D2DBD4;
  --fila:#E3E9E2;       /* row hover */
  --titulo:#173628;
  --bar-h:56px;
  --gap:8px;
  --ease:cubic-bezier(.2,.75,.2,1);
  --dur:460ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --marco:#0E2219; --marco-2:#183427;
    --niebla:#14231C; --papel:#14231C; --tinta:#E6ECE7; --musgo:#9DADA4;
    --linea:#2A3D33; --fila:#1B2E25; --titulo:#E6ECE7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --marco:#0E2219; --marco-2:#183427;
  --niebla:#14231C; --papel:#14231C; --tinta:#E6ECE7; --musgo:#9DADA4;
  --linea:#2A3D33; --fila:#1B2E25; --titulo:#E6ECE7;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; height:100vh; height:100dvh; overflow:hidden;
  display:grid; grid-template-rows:var(--bar-h) minmax(0,1fr);
  background:var(--marco); color:var(--tinta);
  font-family:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--maiz);outline-offset:2px}

/* ---------- bar ---------- */
.bar{
  display:flex; align-items:center; gap:18px; min-width:0;
  padding:0 max(12px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  color:#F1F5F1;
}
.brand{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:6px 4px; border-radius:8px; text-decoration:none;
}
.brand svg{width:26px;height:26px;display:block}
.brand-word{font-size:16px;font-weight:760;font-stretch:120%;letter-spacing:.05em}
.tabs{
  position:relative; display:flex; align-items:center; gap:2px;
  height:100%; min-width:0; overflow-x:auto; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);
          mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative; flex:none; display:flex; align-items:center;
  height:40px; padding:0 12px; border-radius:8px;
  color:rgba(241,245,241,.7); text-decoration:none;
  font-size:15px; font-weight:560; font-stretch:94%;
  transition:color .2s ease, background-color .2s ease;
}
@media (hover:hover){.tab:hover{color:#fff;background:rgba(255,255,255,.07)}}
.tab[aria-current="page"]{color:#fff}
.tab:focus-visible{outline-offset:-2px}
.ind{
  position:absolute; left:0; bottom:7px; height:3px; width:0; border-radius:3px;
  background:var(--maiz); opacity:0; pointer-events:none;
  transition:transform var(--dur) var(--ease), width var(--dur) var(--ease), opacity .2s ease;
}
.ind.snap{transition:opacity .2s ease}
.tools{margin-left:auto;flex:none;display:flex;align-items:center}
.open{
  display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 12px;
  border:1px solid rgba(255,255,255,.18); border-radius:8px;
  color:rgba(241,245,241,.85); text-decoration:none; font-size:14px; font-weight:520;
  transition:background-color .2s ease, border-color .2s ease, opacity .25s ease;
}
@media (hover:hover){.open:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}}
.open svg{width:15px;height:15px;flex:none}
.open.off{opacity:0;pointer-events:none;visibility:hidden}

/* ---------- stage and sheets ---------- */
.stage{position:relative;min-height:0}
.view{
  position:absolute; inset:0 var(--gap) var(--gap);
  border-radius:14px; overflow:hidden; background:var(--papel);
  visibility:hidden;
}
.view.is-active,.view.is-leaving{visibility:visible}
.view.is-active{z-index:2}
.view.is-leaving{z-index:1;pointer-events:none}

.report iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0;
  background:#fff; color-scheme:light;
  opacity:0; transition:opacity .35s ease;
}
.report.is-loaded iframe{opacity:1}
.loader{
  position:absolute; inset:0; display:grid; place-content:center; justify-items:start; gap:14px;
  padding:24px; background:var(--papel); color:var(--tinta);
  transition:opacity .3s ease, visibility 0s linear .3s;
}
.report.is-loaded .loader{opacity:0;visibility:hidden}
.loader-name{margin:0;font-size:clamp(26px,4vw,44px);line-height:1.05;font-weight:720;font-stretch:112%;letter-spacing:-.01em;max-width:18ch}
.loader-msg{margin:0;color:var(--musgo);font-size:15px}
.loader-bar{position:relative;width:180px;height:3px;border-radius:3px;background:var(--linea);overflow:hidden}
.loader-bar span{position:absolute;inset:0 auto 0 0;width:40%;border-radius:3px;background:var(--maiz);animation:slide 1.1s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.loader-slow{margin:6px 0 0;color:var(--musgo);font-size:14px;max-width:44ch}
.loader-slow a{color:var(--tinta);font-weight:600}

/* ---------- home ---------- */
.home{background:var(--niebla);overflow-y:auto;overscroll-behavior:contain}
.home-inner{max-width:1240px;margin:0 auto;padding:clamp(32px,7vh,88px) clamp(20px,5vw,72px) 48px}
.home h1{
  margin:0; color:var(--titulo);
  font-size:clamp(46px,7vw,112px); line-height:.92; font-weight:780; font-stretch:125%;
  letter-spacing:-.02em;
}
.home h1 span{white-space:nowrap}
html.fonts-ready .home h1{animation:widen 1.35s var(--ease) both}
@keyframes widen{from{font-stretch:62%;letter-spacing:.01em}to{font-stretch:125%;letter-spacing:-.02em}}
.lede{margin:22px 0 0;max-width:54ch;font-size:clamp(17px,1.5vw,19px);line-height:1.5;color:var(--musgo)}

.list{list-style:none;margin:clamp(36px,6vh,64px) 0 0;padding:0;border-top:1px solid var(--linea)}
.row{
  display:grid; grid-template-columns:minmax(0,15fr) minmax(0,20fr) auto; align-items:baseline;
  gap:8px 32px; padding:22px 16px; margin:0 -16px;
  border-radius:10px; text-decoration:none; transition:background-color .18s ease;
}
.list li{border-bottom:1px solid var(--linea)}
@media (hover:hover){.row:hover{background:var(--fila)}}
.row:focus-visible{outline-offset:-2px}
.row-name{grid-column:1;grid-row:1;font-size:clamp(22px,2.2vw,28px);line-height:1.15;font-weight:640;font-stretch:100%;letter-spacing:-.005em;color:var(--tinta)}
.row-desc{grid-column:2;grid-row:1;font-size:16px;line-height:1.5;color:var(--musgo);max-width:60ch}
.row-key{
  grid-column:3; grid-row:1; justify-self:end;
  font:600 13px/1 "Archivo",system-ui,sans-serif; font-stretch:100%;
  min-width:26px; height:26px; display:inline-grid; place-items:center; padding:0 7px;
  border:1px solid var(--linea); border-bottom-width:2px; border-radius:6px; color:var(--musgo);
}
.home-foot{margin:28px 0 0;font-size:14px;line-height:1.5;color:var(--musgo);max-width:60ch}

@media (hover:none){.row-key{display:none}}
@media (max-width:1100px){.open-text{display:none}.open{padding:0 9px}}
@media (max-width:820px){
  .home h1 span{display:block}
  .home h1{font-size:clamp(44px,13.5vw,96px)}
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row-desc{grid-column:1/-1;grid-row:2}
  .row-key{grid-column:2}
}
@media (max-width:640px){
  :root{--gap:0px}
  .view{border-radius:0}
  .bar{gap:8px}
  .brand-word{display:none}
  .tab{padding:0 10px;font-size:14.5px}
  .row{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){
  html.fonts-ready .home h1{animation:none}
  .ind{transition:opacity .2s ease}
  .loader-bar span{animation-duration:2.4s}
}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#inicio" aria-label="INMONTE, inicio">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 25 12.5 9l5 8L21 11l8 14Z" fill="#E6B13A"/></svg>
    <span class="brand-word">INMONTE</span>
  </a>
  <nav class="tabs" id="tabs" aria-label="Reportes"><span class="ind snap" id="ind" aria-hidden="true"></span></nav>
  <div class="tools">
    <a class="open off" id="open" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M12 9.5v3.25c0 .41-.34.75-.75.75h-8a.75.75 0 0 1-.75-.75v-8c0-.41.34-.75.75-.75H6.5"/></svg>
      <span class="open-text">Abrir en pestaña nueva</span>
    </a>
  </div>
</header>

<main class="stage" id="stage">
  <section class="view home is-active" id="inicio" aria-labelledby="home-title">
    <div class="home-inner">
      <h1 id="home-title"><span>Reportes</span> <span>INMONTE</span></h1>
      <p class="lede">Elige un reporte para abrirlo. Los que ya abriste siguen cargados mientras cambias entre ellos, así que conservan tus filtros y tu posición.</p>
      <ul class="list" id="list"></ul>
      <p class="home-foot">Cada reporte se muestra tal como fue publicado, con sus propios datos y fechas de corte.</p>
      <noscript><p class="home-foot">Este sitio necesita JavaScript para cambiar entre reportes. También puedes abrirlos directamente: <a href="reports/supply/index.html">Supply chain</a>, <a href="reports/fletes/fletes-report.html">Fletes</a>, <a href="reports/gastos/index.html">Gastos</a>, <a href="reports/publicidad/index.html">Publicidad</a>, <a href="reports/cotizador/index.html">Cotizador</a>.</p></noscript>
    </div>
  </section>
</main>

<script>
(() => {
  const REPORTS = [
    { id: 'supply', tab: 'Supply chain', name: 'Supply chain y operaciones', src: 'reports/supply/index.html',
      desc: 'Inventario, compras, rotación, bodegas, viajes, fletes y guías, con datos de Polux y SAP.' },
    { id: 'fletes', tab: 'Fletes', name: 'Fletes 2026', src: 'reports/fletes/fletes-report.html',
      desc: 'Tarifas por proveedor y ruta, qué tan lleno sale cada vehículo y toneladas por bodega y destino.' },
    { id: 'gastos', tab: 'Gastos', name: 'Gastos 2026', src: 'reports/gastos/index.html',
      desc: 'Cuentas de gasto comparadas con el plan 5+7 y con 2025.' },
    { id: 'publicidad', tab: 'Publicidad', name: 'Publicidad, marketing y atención a clientes', src: 'reports/publicidad/index.html',
      desc: 'Ferias, medios, atención a clientes y vallas desde 2020, con el plan de ahorro de 2026.' },
    { id: 'cotizador', tab: 'Cotizador', name: 'Cotizador de compras', src: 'reports/cotizador/index.html',
      desc: 'Precios sin IVA de empaque, suministros, publicidad y eventos para comparar proveedores y armar una cotización.' },
  ];
  const HOME = 'inicio';
  const byId = Object.fromEntries(REPORTS.map((r, i) => [r.id, { ...r, order: i + 1 }]));

  const stage = document.getElementById('stage');
  const tabs = document.getElementById('tabs');
  const ind = document.getElementById('ind');
  const openLink = document.getElementById('open');
  const homeView = document.getElementById(HOME);
  const list = document.getElementById('list');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  const views = new Map();   // id -> { el, loaded }
  let current = null;
  let running = [];

  /* ---------- build tabs and home rows ---------- */
  for (const r of REPORTS) {
    const a = document.createElement('a');
    a.className = 'tab'; a.href = '#' + r.id; a.dataset.id = r.id; a.textContent = r.tab;
    tabs.appendChild(a); warmOnIntent(a, r.id);

    const li = document.createElement('li');
    li.innerHTML = `<a class="row" href="#${r.id}"><span class="row-name"></span><span class="row-desc"></span><kbd class="row-key" title="Atajo de teclado">${byId[r.id].order}</kbd></a>`;
    li.querySelector('.row-name').textContent = r.name;
    li.querySelector('.row-desc').textContent = r.desc;
    list.appendChild(li); warmOnIntent(li.firstChild, r.id);
  }

  /* Start loading a report as soon as the pointer rests on its link. */
  function warmOnIntent(el, id) {
    let t;
    el.addEventListener('pointerenter', () => { t = setTimeout(() => ensure(id), 140); });
    el.addEventListener('pointerleave', () => clearTimeout(t));
    el.addEventListener('touchstart', () => ensure(id), { passive: true });
  }

  /* ---------- report views (created once, then kept alive) ---------- */
  function ensure(id) {
    if (views.has(id)) return views.get(id);
    const r = byId[id];
    const el = document.createElement('section');
    el.className = 'view report'; el.id = 'view-' + id;
    el.setAttribute('aria-label', r.name); el.inert = true;
    el.innerHTML =
      `<div class="loader" role="status">
         <p class="loader-name"></p>
         <p class="loader-msg">Cargando el reporte…</p>
         <div class="loader-bar" aria-hidden="true"><span></span></div>
         <p class="loader-slow" hidden>Está tardando más de lo normal. Puedes esperar o <a target="_blank" rel="noopener">abrirlo en una pestaña nueva</a>.</p>
       </div>`;
    el.querySelector('.loader-name').textContent = r.name;
    el.querySelector('.loader-slow a').href = r.src;
    const f = document.createElement('iframe');
    f.title = r.name; f.src = r.src; f.allow = 'clipboard-write; fullscreen';
    el.appendChild(f);
    stage.appendChild(el);
    const v = { el, loaded: false };
    const slow = setTimeout(() => { el.querySelector('.loader-slow').hidden = false; }, 15000);
    f.addEventListener('load', () => { clearTimeout(slow); v.loaded = true; el.classList.add('is-loaded'); }, { once: true });
    views.set(id, v);
    return v;
  }

  const viewEl = id => id === HOME ? homeView : ensure(id).el;
  const orderOf = id => id === HOME || !id ? 0 : byId[id].order;

  /* ---------- switching ---------- */
  function go(id, animate = true) {
    if (id === current) return;
    const to = viewEl(id);
    const from = current ? viewEl(current) : null;
    const dir = orderOf(id) >= orderOf(current) ? 1 : -1;

    running.forEach(a => a.cancel()); running = [];
    stage.querySelectorAll('.is-leaving').forEach(e => e.classList.remove('is-leaving'));

    if (from) { from.classList.remove('is-active'); from.inert = true; }
    to.classList.add('is-active'); to.inert = false;

    if (from && animate) swap(from, to, dir);
    current = id;
    updateChrome(id);
  }

  function swap(from, to, dir) {
    const ease = 'cubic-bezier(.2,.75,.2,1)';
    from.classList.add('is-leaving');
    const calm = reduce.matches;
    const dur = calm ? 180 : 460;
    const inFrames = calm
      ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ opacity: 0, transform: `translate3d(${dir * 64}px,0,0)` }, { opacity: 1, transform: 'none' }];
    const outFrames = calm
      ? [{ opacity: 1 }, { opacity: 0 }]
      : [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translate3d(${-dir * 32}px,0,0) scale(.975)` }];
    const a1 = to.animate(inFrames, { duration: dur, easing: ease });
    const a2 = from.animate(outFrames, { duration: dur * .8, easing: ease, fill: 'forwards' });
    running = [a1, a2];
    a2.finished.then(() => { from.classList.remove('is-leaving'); a2.cancel(); }).catch(() => {});
  }

  function updateChrome(id) {
    const r = byId[id];
    document.title = r ? `${r.tab} | Reportes INMONTE` : 'Reportes INMONTE';
    tabs.querySelectorAll('.tab').forEach(t => {
      if (t.dataset.id === id) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    if (r) {
      openLink.href = r.src; openLink.classList.remove('off');
      openLink.setAttribute('aria-label', `Abrir ${r.name} en una pestaña nueva`);
      openLink.title = 'Abrir este reporte solo, en una pestaña nueva';
    } else {
      openLink.classList.add('off');
    }
    moveIndicator();
    const active = tabs.querySelector('[aria-current="page"]');
    if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduce.matches ? 'auto' : 'smooth' });
  }

  function moveIndicator() {
    const a = tabs.querySelector('[aria-current="page"]');
    if (!a) { ind.style.opacity = 0; ind.classList.add('snap'); return; }
    const pad = 12;
    const x = a.offsetLeft + pad, w = a.offsetWidth - pad * 2;
    const wasHidden = ind.style.opacity !== '1';
    if (wasHidden) ind.classList.add('snap');
    ind.style.width = w + 'px';
    ind.style.transform = `translateX(${x}px)`;
    ind.style.opacity = 1;
    if (wasHidden) requestAnimationFrame(() => requestAnimationFrame(() => ind.classList.remove('snap')));
  }

  /* ---------- routing ---------- */
  const target = () => { const h = decodeURIComponent(location.hash.slice(1)); return byId[h] ? h : HOME; };
  addEventListener('hashchange', () => go(target()));
  addEventListener('resize', () => { ind.classList.add('snap'); moveIndicator(); clearTimeout(moveIndicator.t); moveIndicator.t = setTimeout(() => ind.classList.remove('snap'), 120); });

  /* Number keys switch reports while focus is on the site itself. */
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (e.key === '0') location.hash = HOME;
    const r = REPORTS[Number(e.key) - 1];
    if (r && /^[1-9]$/.test(e.key)) location.hash = r.id;
  });

  /* Warm the browser cache for every report once the page is idle. */
  function prefetchAll() {
    const c = navigator.connection;
    if (c && (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || ''))) return;
    for (const r of REPORTS) {
      const l = document.createElement('link'); l.rel = 'prefetch'; l.href = r.src; document.head.appendChild(l);
    }
  }
  addEventListener('load', () => {
    if ('requestIdleCallback' in window) requestIdleCallback(prefetchAll, { timeout: 4000 });
    else setTimeout(prefetchAll, 2000);
  });

  /* Run the headline widening only once the variable font is ready. */
  if (document.fonts && document.fonts.load) {
    Promise.race([
      document.fonts.load('780 100px Archivo'),
      new Promise(res => setTimeout(() => res('late'), 1500)),
    ]).then(v => { if (Array.isArray(v) && v.length) document.documentElement.classList.add('fonts-ready'); });
  }

  go(target(), false);
})();
</script>
</body>
</html>
